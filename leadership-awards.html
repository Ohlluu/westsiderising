<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This page moved to /annual-soiree. Kept so older links from flyers,
         past emails, and search results do not 404. GitHub Pages cannot issue
         a real 301, so this is a meta refresh plus a canonical tag, which is
         what Google treats as a permanent redirect for static hosting. -->
    <meta http-equiv="refresh" content="0; url=annual-soiree">
    <link rel="canonical" href="https://westsiderising.org/annual-soiree">
    <meta name="robots" content="noindex, follow">

    <title>Redirecting to Annual Soiree | WESTSIDE RISING</title>

    <script>
        // replace() rather than assign() so the old URL is not left in the
        // back-button history, which would trap visitors in a redirect loop.
        window.location.replace('annual-soiree');
    </script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f4f8;
            color: #222;
            text-align: center;
            padding: 1.5rem;
        }
        a { color: #1a1a4e; }
    </style>
</head>
<body>
    <p>
        The Leadership Awards page is now <a href="annual-soiree">Annual Soiree</a>.<br>
        If you are not redirected automatically, follow the link above.
    </p>
</body>
</html>
